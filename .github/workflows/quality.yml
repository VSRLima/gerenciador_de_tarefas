name: quality

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      TZ: America/Sao_Paulo
      PORT: 3001
      API_URL: http://localhost:3001
      MONGO_URL: mongodb://localhost:27017/task-manager
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret
      JWT_EXPIRES_IN: 7d
      SWAGGER_LOCAL_USER: swagger
      SWAGGER_LOCAL_PASS: swagger

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace apps/api

      - name: Validate formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Run API tests
        run: npm run test --workspace apps/api

      - name: Run API e2e tests
        run: npm run test:e2e --workspace apps/api

      - name: Build workspaces
        run: npm run build

      - name: Build API image
        run: docker build -f docker/api.Dockerfile -t task-manager-api .

      - name: Build Web image
        run: docker build -f docker/web.Dockerfile -t task-manager-web .
