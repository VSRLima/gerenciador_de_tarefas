services:
  mongo:
    image: mongo:7
    container_name: task-manager-mongo
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-setup:
    image: mongo:7
    container_name: task-manager-mongo-setup
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    entrypoint:
      - bash
      - -lc
      - >
        mongosh --host mongo:27017 --quiet --eval
        'try { rs.status() } catch (e) { rs.initiate({_id: "rs0", members: [{ _id: 0, host: "mongo:27017" }]}) }'
        &&
        until [ "$(mongosh --host mongo:27017 --quiet --eval 'db.hello().isWritablePrimary')" = "true" ];
        do sleep 2; done

  redis:
    image: redis:7-alpine
    container_name: task-manager-redis
    ports:
      - '6379:6379'

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: task-manager-api
    depends_on:
      mongo-setup:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      TZ: America/Sao_Paulo
      PORT: 3001
      API_URL: http://localhost:3001
      MONGO_URL: mongodb://mongo:27017/task-manager?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secret
      JWT_EXPIRES_IN: 7d
      SWAGGER_LOCAL_USER: swagger
      SWAGGER_LOCAL_PASS: swagger
    ports:
      - '3001:3001'

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: task-manager-web
    depends_on:
      - api
    environment:
      TZ: America/Sao_Paulo
      VITE_API_URL: http://localhost:3001/api
    ports:
      - '5173:5173'

volumes:
  mongo-data:
